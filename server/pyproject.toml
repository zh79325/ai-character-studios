[project]
name = "atelier"
version = "0.1.0"
description = "AI 素材与动画制作工具后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    "pillow>=11.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.0",
]

[project.scripts]
atelier-serve = "atelier.serve:main"
atelier-migrate = "atelier.db.migrate:main"
atelier-seed = "atelier.db.seed:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 迁移脚本由 alembic autogenerate 产出，不手改格式
extend-exclude = ["alembic/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["httpx_sse.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
