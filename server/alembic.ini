# 双库各一套独立 version 目录，用 -n 选择：
#   alembic -n config  upgrade head
#   alembic -n runtime upgrade head
# sqlalchemy.url 由各自 env.py 从 atelier.settings 注入，此处不写死路径。

[config]
script_location = alembic/config
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[runtime]
script_location = alembic/runtime
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[alembic]
script_location = alembic/config
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
